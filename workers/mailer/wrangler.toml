# Private mail sender for help desk messages. Deploy with: npx wrangler deploy (from this folder)
name = "lls-mailer"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false   # no public URL: only the website (service binding MAILER) can call it

# Cloudflare Email Routing: can only send to this verified destination address.
[[send_email]]
name = "SEND_EMAIL"
# Must be the real verified inbox (help@lastlegsstanding.com only forwards to it), so it stays the Gmail address.
destination_address = "jeffeersonjeff546@gmail.com"

[vars]
FROM = "helpdesk@lastlegsstanding.com"
TO = "jeffeersonjeff546@gmail.com"
