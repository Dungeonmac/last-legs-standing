name = "last-legs-standing"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# Cloudflare D1 database (SQLite). Locally this is emulated in .wrangler/state.
# Before deploying: run `npx wrangler d1 create lls-db` and paste the real id here.
[[d1_databases]]
binding = "DB"
database_name = "lls-db"
database_id = "ac770aa8-7398-41ae-9d5f-7e9ed52ac5da"

# Cloudflare R2 bucket for the original uploaded run files (GPX / TCX / FIT).
# Off until R2 is enabled in the Cloudflare dashboard. Runs are still verified and saved without it;
# only the original files aren't kept. To turn on: enable R2, run `npx wrangler r2 bucket create lls-uploads`,
# then uncomment these three lines and redeploy.
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "lls-uploads"

# Private mail sender for help desk messages (workers/mailer). Deploy it before the site.
[[services]]
binding = "MAILER"
service = "lls-mailer"

[vars]
SITE_NAME = "Last Legs Standing"
# Master switch for log in, new accounts, race sign-up and payments on the LIVE site.
# Off until Stripe is set up. Turn on by changing to "true" and running npm run deploy.
# (Locally, .dev.vars sets ACCOUNTS_OPEN=true so everything can still be tested.)
ACCOUNTS_OPEN = "false"
# Admins are set on the account itself: after someone signs up, run  npm run make-admin -- their@email.com
# Help desk messages are forwarded here (once RESEND_API_KEY is set) and always kept in Admin.
SUPPORT_EMAIL = "help@lastlegsstanding.com"
# Secrets (set with `wrangler pages secret put NAME`, or in .dev.vars locally):
#   STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY  -> real card payments (otherwise demo mode)
#   STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET     -> "Connect Strava" button
#   RESEND_API_KEY                             -> emails help desk messages to SUPPORT_EMAIL
