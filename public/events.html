<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events · Last Legs Standing</title>
  <meta name="theme-color" content="#0c0d0f">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="events">
<main id="main">
  <section class="page-head">
    <div class="wrap">
      <div class="eyebrow">Events</div>
      <h1 class="display" style="font-size:clamp(2.6rem,6vw,4.4rem)">Every edition.</h1>
      <p class="lead">Sign up for an upcoming challenge, or look back at who outlasted everyone in past editions.</p>
    </div>
  </section>
  <section class="section" style="padding-top:2.5rem">
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="upcoming" aria-selected="true">Upcoming events</button>
        <button role="tab" data-tab="past" aria-selected="false">Previous events</button>
      </div>
      <div id="live-strip"></div>
      <div id="list" class="grid g3"><span class="spinner"></span></div>
    </div>
  </section>
</main>
<script type="module">
  import { mountChrome, api, fmtDate, money, esc, dist } from '/js/common.js';
  mountChrome();
  const [data, config] = await Promise.all([api('/events'), api('/config')]);
  const regOpen = (e) => e.registration_open && config.registrationOpen;
  const list = document.getElementById('list');

  const prizeLine = (e) => e.prizes.map((p) => `${p.place}${['st', 'nd', 'rd'][p.place - 1] || 'th'}: ${esc(p.prize)}`).join(' · ');
  const upcomingCard = (e) => `
    <a class="event-card" href="/event.html?e=${e.slug}">
      <div class="top"><div class="badges"><span class="badge upcoming">Upcoming</span>${regOpen(e) ? '<span class="badge open">Registration open</span>' : '<span class="badge upcoming">Registration opens soon</span>'}</div></div>
      <div class="body">
        <h3>${esc(e.name)}</h3>
        <p class="ink2 small" style="margin:0">${esc(e.tagline || '')}</p>
        <dl class="kv"><dt>Day 1</dt><dd>${fmtDate(e.start_ms, 'UTC')}</dd><dt>Entry fee</dt><dd>${money(e.fee_cents)}</dd><dt>Prizes</dt><dd>${prizeLine(e)}</dd>${regOpen(e) ? `<dt>Registered</dt><dd>${e.registered} runners</dd>` : ''}</dl>
        <span class="btn sm" style="margin-top:auto;align-self:flex-start">View details</span>
      </div>
    </a>`;
  const pastCard = (e) => `
    <a class="event-card past" href="/event.html?e=${e.slug}">
      <div class="top"><div class="badges"><span class="badge completed">Completed</span>${e.is_demo ? '<span class="badge demo">Sample data</span>' : ''}</div></div>
      <div class="body">
        <h3>${esc(e.name)}</h3>
        <dl class="kv"><dt>Started</dt><dd>${fmtDate(e.start_ms, 'UTC')}</dd><dt>Lasted</dt><dd>${e.ended_day} days</dd><dt>Runners</dt><dd>${e.registered}</dd>
          <dt>Champion</dt><dd class="gold">${e.winner ? `${esc(e.winner.name)} (${esc(e.winner.country)})` : '—'}</dd></dl>
        <span class="btn ghost sm" style="margin-top:auto;align-self:flex-start">Results &amp; statistics</span>
      </div>
    </a>`;

  if (data.live.length) {
    document.getElementById('live-strip').innerHTML = data.live.map((e) => `<a class="live-banner" href="/live.html?event=${e.slug}"><span class="badge live">● Live now</span><b>${esc(e.name)}</b><span class="accent" style="margin-left:auto">Follow the race →</span></a>`).join('');
  }
  function show(tab) {
    document.querySelectorAll('[role=tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    const items = data[tab];
    list.innerHTML = items.length
      ? items.map(tab === 'upcoming' ? upcomingCard : pastCard).join('')
      : `<div class="empty" style="grid-column:1/-1">${tab === 'upcoming' ? 'No upcoming events have been announced yet.' : 'No completed events yet.'}</div>`;
    history.replaceState(null, '', `#${tab}`);
  }
  document.querySelectorAll('[role=tab]').forEach((b) => b.addEventListener('click', () => show(b.dataset.tab)));
  show(location.hash === '#past' ? 'past' : 'upcoming');
</script>
</body>
</html>
