<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Last Legs Standing</title>
  <meta name="theme-color" content="#0c0d0f">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
<main id="main">
  <section class="section">
    <div class="wrap" style="max-width:460px">
      <div class="eyebrow">Runners</div>
      <h1 class="display" style="font-size:3.4rem">Log in</h1>
      <p class="ink2">Log in to upload runs, use the tracker and follow your race.</p>
      <form id="login" class="card stack" style="margin-top:1.5rem">
        <div id="err" class="alert error hidden" role="alert"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn block" type="submit">Log in</button>
        <p class="small muted center" style="margin:0">New here? <a href="/signup.html">Sign up for a challenge</a></p>
      </form>
    </div>
  </section>
</main>
<script type="module">
  import { mountChrome, api } from '/js/common.js';
  const me = await mountChrome();
  const next = new URLSearchParams(location.search).get('next');
  const dest = next && next.startsWith('/') && !next.startsWith('//') ? next : '/account.html';
  if (me.user) location.replace(dest);
  document.getElementById('login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.classList.add('hidden');
    try {
      await api('/auth/login', { json: { email: document.getElementById('email').value, password: document.getElementById('password').value } });
      location.href = dest;
    } catch (x) {
      err.textContent = x.message;
      err.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
