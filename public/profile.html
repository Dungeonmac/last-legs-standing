<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My profile · Last Legs Standing</title>
  <meta name="theme-color" content="#0c0d0f">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="profile">
<main id="main">
  <section class="page-head"><div class="wrap">
    <div class="eyebrow">Account</div>
    <h1 class="display" style="font-size:clamp(2.4rem,6vw,4rem)">My profile</h1>
  </div></section>
  <section class="section" style="padding-top:2.5rem"><div class="wrap stack" id="content"><span class="spinner"></span></div></section>
</main>
<script type="module">
  import { mountChrome, requireLogin, api, esc, demoOn, toast } from '/js/common.js';
  import { RANKS, rankFor, nextRank, rankRange, avatarHTML, bestAward } from '/js/ranks.js';
  await mountChrome();
  await requireLogin();
  const $ = (id) => document.getElementById(id);
  let p = await api('/profile');
  const ord = (n) => `${n}${['st', 'nd', 'rd'][n - 1] || 'th'}`;
  // Admins in Demo mode can preview every rank and award ribbon on their own profile (nothing is saved).
  const canPreview = p.isAdmin && demoOn();
  const PREVIEW_AWARDS = [
    ['', 'No award'], ['1|Overall', '1st Overall (crown)'], ['2|Overall', '2nd Overall'], ['1|Women', '1st Women'],
    ['2|Men', '2nd Men'], ['3|Men 40–59', '3rd Men 40–59'], ['1|Women 20–39', '1st Women 20–39'],
  ];
  let preview = { rank: '', award: '' };

  const field = (id, label, value, opts = '') => `<div class="field ${opts}"><label for="${id}">${label}</label><input id="${id}" value="${esc(value ?? '')}"></div>`;

  function topCard() {
    const name = `${p.user.first_name} ${p.user.last_name}`;
    const realRank = rankFor(p.best_day);
    const rank = preview.rank ? RANKS.find((r) => r.key === preview.rank) : realRank;
    const [pl, cat] = preview.award.split('|');
    const award = preview.rank || preview.award ? (pl ? { place: +pl, category: cat } : null) : bestAward(p.awards);
    const next = nextRank(p.best_day);
    return `
      <div class="card raise">
        <div class="row" style="gap:1.6rem;align-items:center">
          <div style="padding-top:.6rem">${avatarHTML({ src: p.avatar, name, award, rank, size: 'md' })}</div>
          <div class="stack" style="flex:1;min-width:220px">
            <div><h2 style="margin:0">${esc(name)}</h2><p class="small muted" style="margin:.2rem 0 0">${esc(p.user.email)}</p></div>
            <div><span class="badge active">${esc(rank.name)}</span>
              <span class="small ink2" style="margin-left:.4rem">Best race: ${p.best_day ? `survived ${p.best_day} day${p.best_day === 1 ? '' : 's'}` : 'no days survived yet'} · ${p.events_competed} race${p.events_competed === 1 ? '' : 's'}</span>
              ${preview.rank || preview.award ? '<span class="badge demo" style="margin-left:.4rem">Demo preview</span>' : ''}</div>
            <p class="small ink2" style="margin:0">${next ? `Survive <b>${next.min === 1 ? 'Day 1' : `${next.min} days`}</b> in a race to reach <b>${esc(next.name)}</b>.` : 'You’ve reached the highest rank. Immortal.'}</p>
            <div class="row" style="gap:.6rem">
              <label class="btn sm" for="pic">${p.avatar ? 'Change picture' : 'Upload a picture'}</label>
              <input type="file" id="pic" accept="image/*" class="hidden">
              ${p.avatar ? '<button class="btn ghost sm" id="remove-pic" type="button">Remove picture</button>' : ''}
            </div>
            <div id="pic-msg" class="small"></div>
          </div>
        </div>
        ${canPreview ? `
        <div class="demo-banner" style="margin:1.4rem 0 0">
          <b>Demo mode:</b> preview any frame on your own profile (only you see this, nothing is saved).
          <div class="row" style="gap:.6rem;margin-top:.6rem">
            <select id="pv-rank" style="width:auto;padding:.4rem .6rem"><option value="">My real rank</option>${RANKS.map((r) => `<option value="${r.key}" ${preview.rank === r.key ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
            <select id="pv-award" style="width:auto;padding:.4rem .6rem">${PREVIEW_AWARDS.map(([v, l]) => `<option value="${v}" ${preview.award === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          </div>
        </div>` : ''}
      </div>`;
  }

  function render() {
    const d = p.details;
    const s = d.shipping || {};
    $('content').innerHTML = `
      ${topCard()}
      <form class="card stack" id="details" novalidate>
        <h3 style="margin:0">My details</h3>
        <div id="d-msg"></div>
        <div class="form-grid">
          ${field('d-first', 'First name', d.first_name, 'c3')}${field('d-last', 'Last name', d.last_name, 'c3')}
          <div class="field c3"><label for="d-email">Email (your login)</label><input id="d-email" value="${esc(d.email)}" disabled><span class="hint">To change it, <a href="/help.html?topic=Account%20or%20login">contact the help desk</a>.</span></div>
          ${field('d-phone', 'Phone', d.phone, 'c3')}
          <div class="field c2"><label for="d-dob">Date of birth</label><input id="d-dob" type="date" value="${esc(d.dob || '')}" ${d.division_locked ? 'disabled' : ''}></div>
          <div class="field c2"><label for="d-gender">Gender</label><select id="d-gender" ${d.division_locked ? 'disabled' : ''}><option value="">Select…</option><option ${d.gender === 'Male' ? 'selected' : ''}>Male</option><option ${d.gender === 'Female' ? 'selected' : ''}>Female</option></select></div>
          ${field('d-country', 'Country', d.country, 'c2')}
          ${d.division_locked ? '<p class="hint" style="grid-column:1/-1;margin:-.4rem 0 0">Date of birth and gender set your division, so they’re locked once you’ve entered a race. Need a correction? Contact the help desk.</p>' : ''}
          ${field('d-em-name', 'Emergency contact name', d.emergency_name, 'c3')}${field('d-em-phone', 'Emergency contact phone', d.emergency_phone, 'c3')}
        </div>
        <h3 style="margin:.5rem 0 0">Shipping address</h3>
        <p class="hint" style="margin:0">Used only to ship a shirt, medal and prizes if you win an award.</p>
        <div class="form-grid">
          ${field('s-line1', 'Street address', s.line1, 'c4')}${field('s-line2', 'Apt / suite', s.line2, 'c2')}
          ${field('s-city', 'City', s.city, 'c2')}${field('s-region', 'State / province', s.region, 'c2')}${field('s-postal', 'ZIP / postal code', s.postal, 'c2')}
          ${field('s-country', 'Country', s.country, 'c3')}
        </div>
        <div><button class="btn" type="submit">Save my details</button></div>
      </form>

      <div class="card">
        <h3 style="margin-top:0">Race emails</h3>
        <label class="check"><input type="checkbox" id="race-emails" ${p.details.race_emails ? 'checked' : ''}> <span>Send me race news and reminders (start dates, registration opening, results). You can turn this off any time.</span></label>
      </div>

      <form class="card stack" id="pw" novalidate>
        <h3 style="margin:0">Change password</h3>
        <div id="pw-msg"></div>
        <div class="form-grid">
          <div class="field c3"><label for="pw-cur">Current password</label><input id="pw-cur" type="password" autocomplete="current-password"></div>
          <div class="field c3"><label for="pw-new">New password</label><input id="pw-new" type="password" autocomplete="new-password"><span class="hint">8+ characters, with a letter and a number.</span></div>
        </div>
        <div><button class="btn ghost" type="submit">Change password</button></div>
      </form>

      <div class="card">
        <h3>My awards</h3>
        ${p.awards.length ? `<ul class="stack" style="list-style:none;padding:0;margin:0">${p.awards.map((a) => `
          <li class="row"><span class="pf-ribbon p${a.place}" style="margin:0">${ord(a.place)} · ${esc(a.category)}</span>
            <a href="/event.html?e=${esc(a.slug)}">${esc(a.event)}</a></li>`).join('')}</ul>`
          : '<p class="ink2 small" style="margin:0">No awards yet. Finish in the top 3 overall, of the men or women, or of your age group to earn a medal ribbon on your frame.</p>'}
      </div>

      <div class="card" id="how">
        <h3>How profile frames work</h3>
        <p class="ink2">Your frame shows how far you’ve gone. It’s set by your <b>best race</b>: the most days you’ve survived in a single race (disqualifications don’t count). Go deeper and the frame gets a fancier shape and color. Survive 60 days and you become <b>Immortal</b>.</p>
        <div class="rank-table">${RANKS.map((r) => `
          <div class="tile ${r.key === rankFor(p.best_day).key ? 'current' : ''}">
            ${avatarHTML({ name: r.name, rank: r, size: 'sm' })}
            <div><b>${esc(r.name)}</b>${r.key === rankFor(p.best_day).key ? ' <span class="badge active">You</span>' : ''}
              <div class="small muted">${rankRange(r)} · ${esc(r.look)}</div></div>
          </div>`).join('')}
        </div>
        <h3 style="margin-top:2rem">Award ribbons</h3>
        <p class="ink2">Finish in the top 3 of any award group and a medal ribbon is added to your frame: gold, silver or bronze, with your place and the group. If you have several awards, your best one is shown. Overall champions also get a crown.</p>
        <div class="rank-table">
          ${avatarHTML({ name: 'Champion', days: 64, award: { place: 1, category: 'Overall' } })}
          ${avatarHTML({ name: 'Second', days: 41, award: { place: 2, category: 'Women' } })}
          ${avatarHTML({ name: 'Third', days: 22, award: { place: 3, category: 'Men 40–59' } })}
        </div>
      </div>`;
    wire();
  }

  function wire() {
    $('pic').addEventListener('change', (e) => upload(e.target.files[0]));
    $('remove-pic')?.addEventListener('click', async () => { await api('/profile/avatar', { json: { remove: true } }); p.avatar = null; render(); });
    $('pv-rank')?.addEventListener('change', (e) => { preview.rank = e.target.value; render(); });
    $('pv-award')?.addEventListener('change', (e) => { preview.award = e.target.value; render(); });
    $('details').addEventListener('submit', async (e) => {
      e.preventDefault();
      const v = (id) => $(id).value.trim();
      try {
        await api('/profile/details', { json: {
          first_name: v('d-first'), last_name: v('d-last'), phone: v('d-phone'), dob: v('d-dob'), gender: v('d-gender'), country: v('d-country'),
          emergency_name: v('d-em-name'), emergency_phone: v('d-em-phone'),
          shipping: { line1: v('s-line1'), line2: v('s-line2'), city: v('s-city'), region: v('s-region'), postal: v('s-postal'), country: v('s-country') },
        } });
        p = await api('/profile');
        render();
        toast('Your details are saved.');
      } catch (x) { $('d-msg').innerHTML = `<div class="alert error">${esc(x.message)}</div>`; }
    });
    $('race-emails').addEventListener('change', async (e) => {
      try {
        await api('/profile/email-pref', { json: { subscribed: e.target.checked } });
        toast(e.target.checked ? 'You’ll get race emails.' : 'Race emails are off.');
      } catch (x) { toast(x.message); e.target.checked = !e.target.checked; }
    });
    $('pw').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await api('/profile/password', { json: { current: $('pw-cur').value, next: $('pw-new').value } });
        $('pw-cur').value = $('pw-new').value = '';
        $('pw-msg').innerHTML = '<div class="alert ok">Password changed. Other devices have been logged out.</div>';
      } catch (x) { $('pw-msg').innerHTML = `<div class="alert error">${esc(x.message)}</div>`; }
    });
  }

  // Square-crop and shrink the picture in the browser, so uploads are small and fast.
  async function upload(file) {
    if (!file) return;
    const msg = $('pic-msg');
    if (!/^image\//.test(file.type)) { msg.innerHTML = '<span class="accent">Choose a picture file (JPG, PNG, WebP or HEIC from your phone).</span>'; return; }
    msg.innerHTML = '<span class="spinner"></span> Uploading…';
    try {
      const img = await createImageBitmap(file);
      const side = Math.min(img.width, img.height);
      const c = document.createElement('canvas');
      c.width = c.height = 320;
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 320, 320);
      let q = 0.86, data = c.toDataURL('image/jpeg', q);
      while (data.length * 0.75 > 140 * 1024 && q > 0.4) data = c.toDataURL('image/jpeg', (q -= 0.12));
      const res = await api('/profile/avatar', { json: { image: data } });
      p.avatar = res.avatar;
      render();
    } catch (x) {
      msg.innerHTML = `<span class="accent">${esc(x.message || 'That picture couldn’t be read. Try a JPG or PNG.')}</span>`;
    }
  }
  render();
</script>
</body>
</html>
